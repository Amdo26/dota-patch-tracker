name: Update Dota patches

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-patches
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the page
        run: python update_patches.py

      - name: Save changes (Vercel redeploys automatically)
        run: |
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add dota2-patch-tracker.html hero_abilities.json stats_history.json
          if git diff --cached --quiet; then
            echo "No changes to save"
          else
            git commit -m "Update patches $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
